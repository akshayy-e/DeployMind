spring.application.name=deploymind-backend
server.port=8000

# Hindsight Cloud
hindsight.api-url=${HINDSIGHT_API_URL:https://api.hindsight.vectorize.io}
hindsight.api-key=${HINDSIGHT_API_KEY:}
hindsight.bank-id=${HINDSIGHT_BANK_ID:deploymind}

# LLM - Groq by default (OpenAI-compatible Chat Completions)
# Add GROQ_API_KEY to enable the real LLM path.
llm.api-url=${LLM_API_URL:https://api.groq.com/openai/v1/chat/completions}
llm.api-key=${GROQ_API_KEY:${LLM_API_KEY:}}
llm.model=${LLM_MODEL:openai/gpt-oss-120b}

spring.jackson.serialization.write-dates-as-timestamps=false
# Keep the frontend API contract compatible with the original FastAPI backend
spring.jackson.property-naming-strategy=SNAKE_CASE
